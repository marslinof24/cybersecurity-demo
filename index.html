<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO 27005 資安風險情境分析平台</title>
    
    <!-- 引入 Tailwind CSS 進行快速且響應式的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            dark: '#0a0f18',
                            panel: '#111827',
                            border: '#1f2937',
                            neonBlue: '#00f0ff',
                            neonGreen: '#00ff66',
                            neonRed: '#ff003c',
                            neonPurple: '#b026ff',
                        }
                    },
                    boxShadow: {
                        'neon-blue': '0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3)',
                        'neon-green': '0 0 10px rgba(0, 255, 102, 0.5), 0 0 20px rgba(0, 255, 102, 0.3)',
                        'neon-red': '0 0 10px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.3)',
                        'neon-purple': '0 0 10px rgba(176, 38, 255, 0.5), 0 0 20px rgba(176, 38, 255, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0f18;
            color: #e5e7eb;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 102, 0.05), transparent 25%);
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f18; 
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151; 
        }

        /* 卡片懸浮動畫 */
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
        }

        /* 動態資料流箭頭動畫 */
        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }
        .flow-line {
            stroke-dasharray: 5;
            animation: dash 1s linear infinite;
        }

        /* 內容切換時的淡入動畫 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 關聯圖節點樣式 */
        .graph-node {
            position: relative;
            z-index: 10;
        }
        .graph-node::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 0.5rem;
            z-index: -1;
            opacity: 0.5;
            filter: blur(8px);
            transition: opacity 0.3s;
        }
        .graph-node:hover::before {
            opacity: 1;
        }
        
        .node-source::before { background: linear-gradient(45deg, #ff003c, transparent); }
        .node-vuln::before { background: linear-gradient(45deg, #b026ff, transparent); }
        .node-risk::before { background: linear-gradient(45deg, #00f0ff, transparent); }
        .node-owner::before { background: linear-gradient(45deg, #00ff66, transparent); }
    </style>
</head>
<body class="h-screen w-full flex flex-col md:flex-row overflow-hidden selection:bg-cyber-neonBlue selection:text-black">

    <!-- 左側選單 (Sidebar) -->
    <aside class="w-full md:w-80 bg-cyber-panel border-b md:border-b-0 md:border-r border-cyber-border flex flex-col h-auto md:h-full flex-shrink-0 z-20 shadow-2xl">
        <div class="p-6 border-b border-cyber-border">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonBlue to-cyber-neonGreen flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-cyber-neonBlue"></i>
                資安風險情境分析
            </h1>
            <p class="text-xs text-gray-400 mt-2 uppercase tracking-widest font-bold">ISO 27005 Framework</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="scenario-list">
            <!-- 選單項目由 JS 動態生成 -->
        </div>

        <div class="p-4 border-t border-cyber-border text-xs text-gray-500 text-center">
            <i class="fa-solid fa-microchip mr-1"></i> Security Dashboard v1.0
        </div>
    </aside>

    <!-- 主畫面內容 (Main Content) -->
    <main class="flex-1 h-full overflow-y-auto p-4 md:p-8 relative">
        <div id="content-container" class="max-w-6xl mx-auto opacity-0">
            
            <!-- 情境標題與描述 -->
            <header class="mb-8">
                <div class="inline-block px-3 py-1 rounded-full border border-cyber-neonBlue/30 bg-cyber-neonBlue/10 text-cyber-neonBlue text-sm font-bold tracking-wide mb-3">
                    <i class="fa-solid fa-radar mr-2"></i>CURRENT SCENARIO
                </div>
                <h2 id="display-title" class="text-3xl md:text-4xl font-bold text-white mb-4 leading-tight"></h2>
                <div class="bg-cyber-panel/50 border-l-4 border-cyber-neonBlue p-4 rounded-r-lg">
                    <p id="display-desc" class="text-gray-300 leading-relaxed text-lg"></p>
                </div>
            </header>

            <!-- 四大核心元素卡片區 -->
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                
                <!-- Threat Source Card -->
                <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonRed hover:shadow-neon-red group relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <i class="fa-solid fa-biohazard text-8xl text-cyber-neonRed"></i>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-gray-400 font-bold uppercase text-sm tracking-wider">威脅來源</h3>
                        <div class="w-8 h-8 rounded-lg bg-cyber-neonRed/20 flex items-center justify-center text-cyber-neonRed">
                            <i class="fa-solid fa-user-ninja"></i>
                        </div>
                    </div>
                    <div class="text-cyber-neonRed text-xs mb-1 font-mono">THREAT SOURCE</div>
                    <p id="card-source" class="text-white font-medium text-lg relative z-10"></p>
                </div>

                <!-- Vulnerability Card -->
                <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonPurple hover:shadow-neon-purple group relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <i class="fa-solid fa-bug text-8xl text-cyber-neonPurple"></i>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-gray-400 font-bold uppercase text-sm tracking-wider">脆弱點 / 漏洞</h3>
                        <div class="w-8 h-8 rounded-lg bg-cyber-neonPurple/20 flex items-center justify-center text-cyber-neonPurple">
                            <i class="fa-solid fa-door-open"></i>
                        </div>
                    </div>
                    <div class="text-cyber-neonPurple text-xs mb-1 font-mono">VULNERABILITY</div>
                    <p id="card-vuln" class="text-white font-medium text-lg relative z-10"></p>
                </div>

                <!-- Risk Card -->
                <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonBlue hover:shadow-neon-blue group relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <i class="fa-solid fa-triangle-exclamation text-8xl text-cyber-neonBlue"></i>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-gray-400 font-bold uppercase text-sm tracking-wider">風險影響</h3>
                        <div class="w-8 h-8 rounded-lg bg-cyber-neonBlue/20 flex items-center justify-center text-cyber-neonBlue">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                    </div>
                    <div class="text-cyber-neonBlue text-xs mb-1 font-mono">RISK (IMPACT)</div>
                    <p id="card-risk" class="text-white font-medium text-lg relative z-10"></p>
                </div>

                <!-- Owner Card -->
                <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonGreen hover:shadow-neon-green group relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <i class="fa-solid fa-chess-king text-8xl text-cyber-neonGreen"></i>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-gray-400 font-bold uppercase text-sm tracking-wider">資產擁有者</h3>
                        <div class="w-8 h-8 rounded-lg bg-cyber-neonGreen/20 flex items-center justify-center text-cyber-neonGreen">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                    </div>
                    <div class="text-cyber-neonGreen text-xs mb-1 font-mono">OWNER</div>
                    <p id="card-owner" class="text-white font-medium text-lg relative z-10"></p>
                </div>
            </section>

            <!-- 關聯圖 (Relationship Graph) -->
            <section class="mt-8 relative">
                <h3 class="text-xl font-bold text-gray-300 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-network-wired text-cyber-neonBlue"></i> 風險鏈路關聯圖 (Risk Chain)
                </h3>
                
                <div class="glass-card rounded-2xl p-6 md:p-10 border border-cyber-border/50">
                    <div class="flex flex-col lg:flex-row items-center justify-between gap-4 lg:gap-2 relative w-full">
                        
                        <!-- Graph Node: Source -->
                        <div class="graph-node node-source w-full lg:w-1/4 bg-gray-900 border border-cyber-neonRed/30 rounded-xl p-4 text-center">
                            <div class="text-cyber-neonRed mb-2"><i class="fa-solid fa-biohazard text-2xl"></i></div>
                            <h4 class="text-sm text-gray-400 font-bold">1. 威脅來源</h4>
                            <p id="graph-source" class="text-white text-sm mt-1 font-medium line-clamp-2" title=""></p>
                        </div>

                        <!-- Connector -->
                        <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonRed flex-shrink-0">
                            <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                                <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                                <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                            </svg>
                            <span class="absolute -top-4 text-[10px] text-gray-500 font-mono tracking-wider">利用 (Exploits)</span>
                        </div>
                        <div class="lg:hidden h-8 flex justify-center text-cyber-neonRed"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                        <!-- Graph Node: Vulnerability -->
                        <div class="graph-node node-vuln w-full lg:w-1/4 bg-gray-900 border border-cyber-neonPurple/30 rounded-xl p-4 text-center">
                            <div class="text-cyber-neonPurple mb-2"><i class="fa-solid fa-door-open text-2xl"></i></div>
                            <h4 class="text-sm text-gray-400 font-bold">2. 脆弱點</h4>
                            <p id="graph-vuln" class="text-white text-sm mt-1 font-medium line-clamp-2" title=""></p>
                        </div>

                        <!-- Connector -->
                        <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonPurple flex-shrink-0 relative">
                            <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                                <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                                <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                            </svg>
                            <span class="absolute -top-4 text-[10px] text-gray-500 font-mono tracking-wider">導致 (Causes)</span>
                        </div>
                        <div class="lg:hidden h-8 flex justify-center text-cyber-neonPurple"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                        <!-- Graph Node: Risk -->
                        <div class="graph-node node-risk w-full lg:w-1/4 bg-gray-900 border border-cyber-neonBlue/30 rounded-xl p-4 text-center">
                            <div class="text-cyber-neonBlue mb-2"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                            <h4 class="text-sm text-gray-400 font-bold">3. 風險</h4>
                            <p id="graph-risk" class="text-white text-sm mt-1 font-medium line-clamp-2" title=""></p>
                        </div>

                        <!-- Connector -->
                        <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonBlue flex-shrink-0 relative">
                            <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                                <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                                <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                            </svg>
                            <span class="absolute -top-4 text-[10px] text-gray-500 font-mono tracking-wider">影響 (Impacts)</span>
                        </div>
                        <div class="lg:hidden h-8 flex justify-center text-cyber-neonBlue"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                        <!-- Graph Node: Owner -->
                        <div class="graph-node node-owner w-full lg:w-1/4 bg-gray-900 border border-cyber-neonGreen/30 rounded-xl p-4 text-center">
                            <div class="text-cyber-neonGreen mb-2"><i class="fa-solid fa-user-shield text-2xl"></i></div>
                            <h4 class="text-sm text-gray-400 font-bold">4. 擁有者</h4>
                            <p id="graph-owner" class="text-white text-sm mt-1 font-medium line-clamp-2" title=""></p>
                        </div>

                    </div>
                </div>
            </section>
            
        </div>
        
        <!-- 空白狀態提示 (初始載入或未選擇時的防呆機制，雖然預設會載入第一筆) -->
        <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-gray-500">
            <i class="fa-solid fa-satellite-dish text-6xl mb-4 opacity-50"></i>
            <p class="text-xl">請從左側選擇一個情境以進行分析</p>
        </div>

    </main>

    <script>
        // --- 1. Mock Data 準備 ---
        const scenarios = [
            {
                id: 'scenario-1',
                title: '頂峰科技停電事件',
                icon: 'fa-bolt',
                desc: '高溫酷暑導致區域電網超載停電，研發部門因缺乏備份習慣，實體硬碟損壞導致核心原始碼遺失。',
                owner: '核心研發部門',
                source: '區域電網超載 (環境/基礎設施失效)',
                vulnerability: '缺乏嚴謹資安規範與定期備份習慣、資料僅存於本地端',
                risk: '核心新產品製程參數與原始碼永久遺失，影響公司命脈'
            },
            {
                id: 'scenario-2',
                title: '伺服器重啟防禦盲區',
                icon: 'fa-server',
                desc: '停電導致伺服器斷電重啟，網路防火牆短暫失效，潛伏的外部駭客趁亂繞過憑證潛入客戶系統。',
                owner: 'IT維運部門 / 客戶關係管理部門',
                source: '外部駭客集團',
                vulnerability: '伺服器重啟時的安全防禦盲區 (缺乏高可用性與故障轉移機制)',
                risk: '客戶管理系統遭未經授權存取，機敏資料外洩'
            },
            {
                id: 'scenario-3',
                title: '新系統權限與通訊風險',
                icon: 'fa-wifi',
                desc: '開發全新的「智慧採購與電商平台」，需考量外部供應商登入、外派業務使用公用 Wi-Fi 等情境。',
                owner: '財務會計主管 (阿珍姐) / 採購部門',
                source: '未經授權的外部人員 / 惡意中間人 (公用 Wi-Fi)',
                vulnerability: '密碼設定過於簡單、缺乏雙重驗證、通訊過程未經加密',
                risk: '外人冒充員工、財務報表遭竊聽或篡改'
            }
        ];

        let currentActiveId = null;

        // --- 2. 獲取 DOM 元素 ---
        const scenarioListEl = document.getElementById('scenario-list');
        const contentContainer = document.getElementById('content-container');
        
        // 顯示內容區元素
        const elTitle = document.getElementById('display-title');
        const elDesc = document.getElementById('display-desc');
        
        const elCardSource = document.getElementById('card-source');
        const elCardVuln = document.getElementById('card-vuln');
        const elCardRisk = document.getElementById('card-risk');
        const elCardOwner = document.getElementById('card-owner');

        const elGraphSource = document.getElementById('graph-source');
        const elGraphVuln = document.getElementById('graph-vuln');
        const elGraphRisk = document.getElementById('graph-risk');
        const elGraphOwner = document.getElementById('graph-owner');

        // --- 3. 渲染側邊欄選單 ---
        function renderSidebar() {
            scenarioListEl.innerHTML = '';
            scenarios.forEach((scenario, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition-all duration-300 flex items-center gap-3 group outline-none`;
                
                // 動態設定選中/未選中樣式
                btn.id = `btn-${scenario.id}`;
                
                btn.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center flex-shrink-0 group-hover:text-cyber-neonBlue transition-colors shadow-inner">
                        <i class="fa-solid ${scenario.icon}"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-cyber-neonBlue transition-colors">${scenario.title}</div>
                        <div class="text-xs text-gray-500 mt-1">Scenario ${index + 1}</div>
                    </div>
                `;
                
                btn.onclick = () => selectScenario(scenario.id);
                scenarioListEl.appendChild(btn);
            });
        }

        // --- 4. 處理選擇與資料更新 ---
        function selectScenario(id) {
            if (currentActiveId === id) return;
            currentActiveId = id;

            // 更新按鈕樣式
            scenarios.forEach(s => {
                const btn = document.getElementById(`btn-${s.id}`);
                if (s.id === id) {
                    btn.classList.remove('border-transparent', 'bg-transparent', 'hover:bg-slate-800/50');
                    btn.classList.add('border-cyber-neonBlue/50', 'bg-cyber-neonBlue/10', 'shadow-[inset_0_0_15px_rgba(0,240,255,0.1)]');
                    btn.querySelector('.w-10').classList.add('text-cyber-neonBlue', 'border', 'border-cyber-neonBlue/50');
                } else {
                    btn.classList.remove('border-cyber-neonBlue/50', 'bg-cyber-neonBlue/10', 'shadow-[inset_0_0_15px_rgba(0,240,255,0.1)]');
                    btn.classList.add('border-transparent', 'bg-transparent', 'hover:bg-slate-800/50');
                    btn.querySelector('.w-10').classList.remove('text-cyber-neonBlue', 'border', 'border-cyber-neonBlue/50');
                    btn.querySelector('.w-10').classList.add('text-gray-400');
                }
            });

            const data = scenarios.find(s => s.id === id);
            
            // 觸發淡入淡出動畫
            contentContainer.classList.remove('fade-in');
            
            // 強制重繪以重啟動畫
            void contentContainer.offsetWidth; 
            
            // 更新文字內容
            elTitle.textContent = data.title;
            elDesc.textContent = data.desc;
            
            // 卡片
            elCardSource.textContent = data.source;
            elCardVuln.textContent = data.vulnerability;
            elCardRisk.textContent = data.risk;
            elCardOwner.textContent = data.owner;

            // 圖表節點 (並加上 title 以支援 tooltip 顯示完整文字)
            elGraphSource.textContent = data.source;
            elGraphSource.title = data.source;
            
            elGraphVuln.textContent = data.vulnerability;
            elGraphVuln.title = data.vulnerability;
            
            elGraphRisk.textContent = data.risk;
            elGraphRisk.title = data.risk;
            
            elGraphOwner.textContent = data.owner;
            elGraphOwner.title = data.owner;

            contentContainer.classList.add('fade-in');
        }

        // --- 5. 初始化應用程式 ---
        window.onload = () => {
            renderSidebar();
            // 預設選擇第一個情境
            if (scenarios.length > 0) {
                selectScenario(scenarios[0].id);
            }
        };

    </script>
</body>
</html>
