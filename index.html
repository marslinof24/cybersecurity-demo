<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 資安風險情境分析平台</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        cyber: {
                            dark: '#0a0f18', panel: '#111827', border: '#1f2937',
                            neonBlue: '#00f0ff', neonGreen: '#00ff66',
                            neonRed: '#ff003c', neonPurple: '#b026ff',
                        }
                    },
                    boxShadow: {
                        'neon-blue': '0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3)',
                        'neon-green': '0 0 10px rgba(0, 255, 102, 0.5), 0 0 20px rgba(0, 255, 102, 0.3)',
                        'neon-red': '0 0 10px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.3)',
                        'neon-purple': '0 0 10px rgba(176, 38, 255, 0.5), 0 0 20px rgba(176, 38, 255, 0.3)',
                        'glow-input': '0 0 15px rgba(0, 240, 255, 0.2)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0f18; color: #e5e7eb;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 102, 0.05), transparent 25%);
        }

        /* 表單元素特效 */
        .cyber-input {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid #1f2937;
            color: white;
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* 視圖切換動畫 */
        .view-hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片懸浮動畫 */
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }

        /* 雷達掃描動畫 */
        .radar-container {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.3);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            background: 
                linear-gradient(90deg, transparent 49.5%, rgba(0,240,255,0.2) 49.5%, rgba(0,240,255,0.2) 50.5%, transparent 50.5%),
                linear-gradient(0deg, transparent 49.5%, rgba(0,240,255,0.2) 49.5%, rgba(0,240,255,0.2) 50.5%, transparent 50.5%);
        }
        .radar-scanner {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 240, 255, 0.8) 100%);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 關聯圖節點與箭頭 */
        @keyframes dash { to { stroke-dashoffset: -20; } }
        .flow-line { stroke-dasharray: 5; animation: dash 1s linear infinite; }
        
        .graph-node { position: relative; z-index: 10; }
        .graph-node::before {
            content: ''; position: absolute; inset: -2px; border-radius: 0.5rem;
            z-index: -1; opacity: 0.5; filter: blur(8px); transition: opacity 0.3s;
        }
        .graph-node:hover::before { opacity: 1; }
        .node-source::before { background: linear-gradient(45deg, #ff003c, transparent); }
        .node-vuln::before { background: linear-gradient(45deg, #b026ff, transparent); }
        .node-risk::before { background: linear-gradient(45deg, #00f0ff, transparent); }
        .node-owner::before { background: linear-gradient(45deg, #00ff66, transparent); }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4 selection:bg-cyber-neonBlue selection:text-black overflow-y-auto">

    <!-- 視圖 1：問卷設定區 -->
    <div id="view-survey" class="w-full max-w-3xl glass-card rounded-2xl p-6 md:p-10 fade-in">
        <header class="mb-8 text-center border-b border-cyber-border pb-6">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonBlue to-cyber-neonGreen flex items-center justify-center gap-3 mb-2">
                <i class="fa-solid fa-shield-virus text-cyber-neonBlue"></i>
                AI 企業資安風險健診
            </h1>
            <p class="text-gray-400 text-sm">基於 ISO 27005 框架，請描述您的公司情境以進行動態分析</p>
        </header>

        <form id="survey-form" class="space-y-6">
            <!-- API Key -->
            <div class="bg-gray-900/50 p-4 rounded-xl border border-cyber-neonBlue/30">
                <label class="block text-cyber-neonBlue text-sm font-bold mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-key"></i> Gemini API Key (選填)
                </label>
                <input type="password" id="input-apikey" placeholder="請輸入 API Key (若於此平台測試可留空)" 
                       class="cyber-input w-full p-3 rounded-lg text-sm">
                <p class="text-xs text-gray-500 mt-2">提示：若需自行部署，請務必填寫以啟動 AI 模型分析。</p>
            </div>

            <!-- Q1: 資產 -->
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2">
                    1. 您想保護的核心資產、系統或業務是什麼？
                </label>
                <textarea id="input-asset" rows="2" required placeholder="例如：客戶資料庫、產線機台、線上支付系統..." 
                          class="cyber-input w-full p-3 rounded-lg text-sm resize-none"></textarea>
            </div>

            <!-- Q2: 威脅 -->
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2">
                    2. 您最擔心的潛在威脅來源是什麼？
                </label>
                <textarea id="input-threat" rows="2" required placeholder="例如：外部駭客勒索、內部員工疏失、地震斷電..." 
                          class="cyber-input w-full p-3 rounded-lg text-sm resize-none"></textarea>
            </div>

            <!-- Q3: 弱點 -->
            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2">
                    3. 貴公司目前在該資產上，覺得最缺乏的防護或弱點是什麼？
                </label>
                <textarea id="input-vuln" rows="2" required placeholder="例如：沒有雙重驗證、沒有異地備份、系統久未更新..." 
                          class="cyber-input w-full p-3 rounded-lg text-sm resize-none"></textarea>
            </div>

            <!-- 錯誤提示區塊 -->
            <div id="error-msg" class="hidden bg-red-500/20 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text">發生錯誤</span>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" class="w-full bg-transparent border-2 border-cyber-neonBlue text-cyber-neonBlue hover:bg-cyber-neonBlue hover:text-black font-bold py-4 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-3 group">
                <span>開始 AI 情境分析</span>
                <i class="fa-solid fa-robot group-hover:animate-bounce"></i>
            </button>
        </form>
    </div>

    <!-- 視圖 2：AI 分析載入中 -->
    <div id="view-loading" class="view-hidden w-full flex-col items-center justify-center py-20 fade-in">
        <div class="radar-container mb-8">
            <div class="radar-scanner"></div>
        </div>
        <h2 class="text-2xl font-bold text-cyber-neonBlue tracking-widest animate-pulse mb-2">AI 分析中...</h2>
        <p class="text-gray-400 font-mono text-sm" id="loading-text">正在比對 ISO 27005 資安框架資料庫</p>
    </div>

    <!-- 視圖 3：視覺化圖表結果 -->
    <div id="view-dashboard" class="view-hidden w-full max-w-6xl fade-in">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end border-b border-cyber-border pb-6 gap-4">
            <div>
                <div class="inline-flex px-3 py-1 rounded-full border border-cyber-neonBlue/30 bg-cyber-neonBlue/10 text-cyber-neonBlue text-xs font-bold tracking-wide mb-3 items-center">
                    <i class="fa-solid fa-check-double mr-2"></i>AI GENERATED REPORT
                </div>
                <h2 class="text-3xl md:text-4xl font-bold text-white leading-tight">資安風險情境診斷報告</h2>
            </div>
            <button onclick="restartConsultation()" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-2 rounded-lg text-sm border border-gray-600 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> 重新諮詢
            </button>
        </header>

        <div class="bg-cyber-panel/50 border-l-4 border-cyber-neonBlue p-5 rounded-r-lg mb-8 glass-card">
            <h3 class="text-sm text-cyber-neonBlue font-bold mb-2 uppercase"><i class="fa-solid fa-file-lines mr-1"></i> 綜整情境描述</h3>
            <p id="display-desc" class="text-gray-300 leading-relaxed text-lg"></p>
        </div>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <!-- Source -->
            <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonRed">
                <div class="flex justify-between mb-4">
                    <h3 class="text-gray-400 font-bold uppercase text-sm">威脅來源</h3>
                    <i class="fa-solid fa-user-ninja text-cyber-neonRed text-xl"></i>
                </div>
                <p id="card-source" class="text-white font-medium"></p>
            </div>
            <!-- Vuln -->
            <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonPurple">
                <div class="flex justify-between mb-4">
                    <h3 class="text-gray-400 font-bold uppercase text-sm">脆弱點</h3>
                    <i class="fa-solid fa-door-open text-cyber-neonPurple text-xl"></i>
                </div>
                <p id="card-vuln" class="text-white font-medium"></p>
            </div>
            <!-- Risk -->
            <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonBlue">
                <div class="flex justify-between mb-4">
                    <h3 class="text-gray-400 font-bold uppercase text-sm">風險影響</h3>
                    <i class="fa-solid fa-bolt text-cyber-neonBlue text-xl"></i>
                </div>
                <p id="card-risk" class="text-white font-medium"></p>
            </div>
            <!-- Owner -->
            <div class="glass-card rounded-xl p-5 border-t-4 border-t-cyber-neonGreen">
                <div class="flex justify-between mb-4">
                    <h3 class="text-gray-400 font-bold uppercase text-sm">資產擁有者</h3>
                    <i class="fa-solid fa-user-shield text-cyber-neonGreen text-xl"></i>
                </div>
                <p id="card-owner" class="text-white font-medium"></p>
            </div>
        </section>

        <section class="relative glass-card rounded-2xl p-6 md:p-10 border border-cyber-border/50 mb-10">
            <h3 class="text-xl font-bold text-gray-300 mb-8 flex items-center justify-center gap-2">
                <i class="fa-solid fa-network-wired text-cyber-neonBlue"></i> 風險鏈路關聯圖 (Risk Chain)
            </h3>
            
            <div class="flex flex-col lg:flex-row items-center justify-between gap-4 lg:gap-2 relative w-full">
                <!-- Node: Source -->
                <div class="graph-node node-source w-full lg:w-1/4 bg-gray-900 border border-cyber-neonRed/30 rounded-xl p-4 text-center">
                    <div class="text-cyber-neonRed mb-2"><i class="fa-solid fa-biohazard text-2xl"></i></div>
                    <h4 class="text-sm text-gray-400 font-bold">1. 威脅來源</h4>
                    <p id="graph-source" class="text-white text-sm mt-1 font-medium"></p>
                </div>

                <!-- Connector -->
                <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonRed relative">
                    <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                    </svg>
                    <span class="absolute -top-5 text-[11px] text-gray-400 font-mono">利用</span>
                </div>
                <div class="lg:hidden h-8 flex justify-center text-cyber-neonRed"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                <!-- Node: Vulnerability -->
                <div class="graph-node node-vuln w-full lg:w-1/4 bg-gray-900 border border-cyber-neonPurple/30 rounded-xl p-4 text-center">
                    <div class="text-cyber-neonPurple mb-2"><i class="fa-solid fa-door-open text-2xl"></i></div>
                    <h4 class="text-sm text-gray-400 font-bold">2. 脆弱點</h4>
                    <p id="graph-vuln" class="text-white text-sm mt-1 font-medium"></p>
                </div>

                <!-- Connector -->
                <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonPurple relative">
                    <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                    </svg>
                    <span class="absolute -top-5 text-[11px] text-gray-400 font-mono">導致</span>
                </div>
                <div class="lg:hidden h-8 flex justify-center text-cyber-neonPurple"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                <!-- Node: Risk -->
                <div class="graph-node node-risk w-full lg:w-1/4 bg-gray-900 border border-cyber-neonBlue/30 rounded-xl p-4 text-center">
                    <div class="text-cyber-neonBlue mb-2"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                    <h4 class="text-sm text-gray-400 font-bold">3. 風險</h4>
                    <p id="graph-risk" class="text-white text-sm mt-1 font-medium"></p>
                </div>

                <!-- Connector -->
                <div class="hidden lg:flex w-16 items-center justify-center text-cyber-neonBlue relative">
                    <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none">
                        <path class="flow-line" d="M0,10 L90,10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <polygon points="90,5 100,10 90,15" fill="currentColor"/>
                    </svg>
                    <span class="absolute -top-5 text-[11px] text-gray-400 font-mono">影響</span>
                </div>
                <div class="lg:hidden h-8 flex justify-center text-cyber-neonBlue"><i class="fa-solid fa-arrow-down animate-bounce"></i></div>

                <!-- Node: Owner -->
                <div class="graph-node node-owner w-full lg:w-1/4 bg-gray-900 border border-cyber-neonGreen/30 rounded-xl p-4 text-center">
                    <div class="text-cyber-neonGreen mb-2"><i class="fa-solid fa-user-shield text-2xl"></i></div>
                    <h4 class="text-sm text-gray-400 font-bold">4. 擁有者</h4>
                    <p id="graph-owner" class="text-white text-sm mt-1 font-medium"></p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // DOM 元素參考
        const viewSurvey = document.getElementById('view-survey');
        const viewLoading = document.getElementById('view-loading');
        const viewDashboard = document.getElementById('view-dashboard');
        const form = document.getElementById('survey-form');
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');

        // 隱藏/顯示視圖控制
        function switchView(viewId) {
            [viewSurvey, viewLoading, viewDashboard].forEach(el => {
                el.classList.add('view-hidden');
                el.classList.remove('fade-in');
            });
            const target = document.getElementById(viewId);
            target.classList.remove('view-hidden');
            // 觸發 reflow 讓動畫重新執行
            void target.offsetWidth;
            target.classList.add('fade-in');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 重新諮詢
        function restartConsultation() {
            switchView('view-survey');
        }

        // 顯示錯誤訊息
        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.remove('hidden');
            switchView('view-survey');
        }

        // 處理表單送出與 AI API 串接
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden'); // 隱藏之前的錯誤

            // 取得輸入值
            const apiKey = document.getElementById('input-apikey').value.trim() || ""; 
            const asset = document.getElementById('input-asset').value.trim();
            const threat = document.getElementById('input-threat').value.trim();
            const vuln = document.getElementById('input-vuln').value.trim();

            if (!asset || !threat || !vuln) {
                showError("請填寫所有問卷欄位");
                return;
            }

            // 切換到載入畫面
            switchView('view-loading');

            // 準備 Gemini API Payload
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                systemInstruction: {
                    parts: [{ 
                        text: "你是一位精通 ISO 27005 標準的專業企業資安顧問。請根據使用者輸入的「核心資產」、「威脅來源」與「弱點」描述，進行邏輯分析，並產出風險情境。文字請使用專業的台灣繁體中文。請務必嚴格遵循輸出的 JSON 結構。" 
                    }]
                },
                contents: [{
                    role: "user",
                    parts: [{ text: `請分析以下情境：\n核心資產或業務: ${asset}\n最擔心的威脅來源: ${threat}\n目前最缺乏的防護或弱點: ${vuln}` }]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            scenarioDescription: { type: "STRING", description: "將資產、威脅與弱點串聯起來的整體風險情境描述，約 50 到 100 字" },
                            owner: { type: "STRING", description: "從資產推斷出的資產擁有者或負責部門名稱" },
                            source: { type: "STRING", description: "精煉過後的威脅來源描述" },
                            vulnerability: { type: "STRING", description: "精煉過後的脆弱點或漏洞描述" },
                            risk: { type: "STRING", description: "一旦威脅利用弱點成功後，將導致的具體業務風險或營運衝擊" }
                        },
                        required: ["scenarioDescription", "owner", "source", "vulnerability", "risk"]
                    }
                }
            };

            // 動態載入文字效果
            const loadingTexts = ["正在比對 ISO 27005 資安框架資料庫...", "正在解析威脅建模邏輯...", "正在計算業務衝擊與風險矩陣...", "生成最終視覺化報告..."];
            let textIdx = 0;
            const loadingInterval = setInterval(() => {
                textIdx = (textIdx + 1) % loadingTexts.length;
                document.getElementById('loading-text').textContent = loadingTexts[textIdx];
            }, 2000);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                clearInterval(loadingInterval);

                if (!response.ok) {
                    throw new Error(`API 請求失敗 (${response.status})。請確認 API Key 是否正確。`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const parsedData = JSON.parse(jsonString);
                    
                    // 將資料注入儀表板
                    renderDashboard(parsedData);
                    switchView('view-dashboard');
                } else {
                    throw new Error("API 回傳格式異常，請稍後再試。");
                }

            } catch (error) {
                clearInterval(loadingInterval);
                console.error(error);
                showError(error.message);
            }
        });

        function renderDashboard(data) {
            // 寫入綜整描述
            document.getElementById('display-desc').textContent = data.scenarioDescription;
            
            // 寫入卡片
            document.getElementById('card-source').textContent = data.source;
            document.getElementById('card-vuln').textContent = data.vulnerability;
            document.getElementById('card-risk').textContent = data.risk;
            document.getElementById('card-owner').textContent = data.owner;

            // 寫入流程圖節點 (加上 title 支援過長字串)
            document.getElementById('graph-source').textContent = data.source;
            document.getElementById('graph-source').title = data.source;
            
            document.getElementById('graph-vuln').textContent = data.vulnerability;
            document.getElementById('graph-vuln').title = data.vulnerability;
            
            document.getElementById('graph-risk').textContent = data.risk;
            document.getElementById('graph-risk').title = data.risk;
            
            document.getElementById('graph-owner').textContent = data.owner;
            document.getElementById('graph-owner').title = data.owner;
        }

    </script>
</body>
</html>
